aid: lara-ai
name: Lara AI
description: >-
  Lara AI is an AI agent for People and HR teams, built by SIGMA PEOPLE S.R.L.
  in Argentina and sold across Latin America. Lara talks to every employee in
  the messaging tools they already use — WhatsApp, Slack, Microsoft Teams and
  Google Chat — and covers five modules: Employee Experience (continuous
  listening, custom surveys and people analytics), Helpdesk (an AI help desk the
  company says automates over 80% of employee FAQs and requests), Onboarding
  (end-to-end automated flows for new hires), Comunicaciones (personalised,
  scheduled and segmented employee communications) and People Analytics
  (dashboards and reports built from people data). It integrates with HR
  platforms including SAP, BambooHR, Oracle, Buk, Humand, Mandu and Rex+, and
  targets retail, consumer goods, technology, consulting, banking and finance,
  education and manufacturing. Lara AI publishes a marketing site, a Spanish
  help centre and a real llms.txt, but no public API program — there is no
  developer portal, API reference, OpenAPI definition or SDK.
